name: Test
on: [push, pull_request]
jobs:
  rust-and-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install headless compositor and software graphics
        run: sudo apt-get update && sudo apt-get install -y sway grim libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dri
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --test headless -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-ui
          path: artifacts/*.png
